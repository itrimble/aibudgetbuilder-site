# Runs the tests, the audit and the build on every pull request, so a pull request from a cloud routine (which cannot run npm itself) is still verified.
# The methodology status section is generated, so for a branch in this repo the workflow regenerates it and commits the result to the branch.
name: Checks

on:
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate the methodology status and commit it to the branch
        run: |
          npm run methodology
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/METHODOLOGY.md
          if git diff --cached --quiet; then echo "Methodology already current."; else
            git commit -m "Regenerate the methodology status"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - run: npm test
      - run: npm run methodology:check
      - run: npm run build
